<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>進捗表示とフィードバック</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4 p-4 border rounded">
      <h4 class="text-center mb-4">進捗とユーザーフィードバックの例</h4>

      <h5>プログレスバー</h5>

      <div class="progress mb-3">
        <div class="progress-bar bg-primary" style="width: 50%">50%</div>
      </div>

      <div class="progress mb-4">
        <div class="progress-bar bg-success" style="width: 75%">75%完了</div>
      </div>

      <hr />

      <h5 class="text-center">スピナー（読み込み中）</h5>

      <div class="text-center mb-4">
        <div class="spinner-border text-info me-3">
          <span class="visually-hidden">読み込み中...</span>
        </div>

        <div class="spinner-grow text-warning me-3">
          <span class="visually-hidden">読み込み中...</span>
        </div>

        <button class="btn btn-secondary" type="button" disabled>
          <span class="spinner-border spinner-border-sm"></span>
          処理中...
        </button>
      </div>

      <hr />

      <h5>アラートメッセージ</h5>

      <div class="alert alert-success">
        <strong>成功しました！</strong>
        データが正常に更新されました。
      </div>

      <div class="alert alert-warning">
        <strong>警告:</strong>
        未入力の項目があります。ご確認ください。
      </div>

      <div class="alert alert-danger">
        <strong>エラーが発生しました。</strong>
        サーバーとの接続に失敗しました。
      </div>

      <hr />

      <h5 class="text-center">モーダルダイアログ</h5>

      <div class="text-center">
        <button
          class="btn btn-info"
          data-bs-toggle="modal"
          data-bs-target="#yourModalId"
        >
          お知らせモーダルを開く
        </button>
      </div>
    </div>

    <div class="modal fade" id="yourModalId" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">お知らせ</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <p>
              現在、データを処理しています。 完了までしばらくお待ちください。
            </p>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              閉じる
            </button>

            <button type="button" class="btn btn-primary">変更を保存</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
