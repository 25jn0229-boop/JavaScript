<!doctype html>
<html>

    <script src="../jquery-3.6.0.js"></script>
  </head>
  <body id="blog">
    <div id="container">
      <header>
        <h1>花と空の風景のブログ</h1>
        <p>管理人の趣味で撮った「花」の写真をアップしているサイトです。</p>
      </header>

      <nav>
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="photo.html">Photo</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>

      <article>
        <h2>沖縄の花</h2>
        <time datetime="2017-2-20" pubdata>2017年2月20日</time>
        <p>2月中旬、沖縄出張の帰りに様々な花の写真を撮ってきました。</p>

        <figure>
          <figcaption>沖縄の花々</figcaption>
          <p><img src="images/flower1.jpg" alt="A" id="slide" /></p>
        </figure>

        <aside>
          <p>沖縄は陽ざしも強く、春の陽気を感じさせます。</p>
        </aside>
      </article>

      <footer>
        <p><small>Copyright(C)2015Free Cloud All Rights Reserved.</small></p>
      </footer>
    </div>
    <script>
      $(function () {
        var imgList = [
          "images/flower1.JPG",
          "images/flower2.JPG",
          "images/flower3.JPG",
          "images/flower4.JPG",
        ];

        let counter = 0;

        setInterval(function () {
          counter = (counter + 1) % imgList.length;

          $("#slide").fadeOut(400, function () {
            $(this).attr("src", imgList[counter]).fadeIn(400);
          });
        }, 3000);
      });
    </script>
  </body>
