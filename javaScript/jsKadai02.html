<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let x = 365;

      document.write(`<h1>1年を${x}日とした場合に</h1>`);
      document.write(`<ul>
        <li>1年は${x * 24}時間です</li>
        <li>1年は${x * 24 * 60}分です</li>
        <li>1年は${x * 24 * 60 * 60}秒です</li>
        </ul>`);
    </script>
  </body>
</html>
