<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let kanto = ["東京", "埼玉", "千葉", "神奈川", "茨城", "栃木", "群馬"];

      for (i = 0; i < kanto.length; i++) {
        document.write(`<p>kanto[${i}]:${kanto[i]}</p>`);
      }
      document.write(`<p>kanto[]の長さは${kanto.length}です。</p>`);
    </script>
  </body>
</html>
