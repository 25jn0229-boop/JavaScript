<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>JavaScriptにおけるDOMの扱い方</h1>
    <p>DOMによって、「id1」のidがついたpタグの中身を変更します。</p>
    <p id="id1">我が輩は猫である</p>
    <button onclick="dog()">犬に変更</button>
    <button onclick="cat()">猫に戻す</button>

    <!--課題10-2追加-->
    <button onclick="red()">赤色に変更</button>
    <button onclick="blue()">青色に変更</button>
    <button onclick="black()">黒色に変更</button>
    <script>
      function dog() {
        document.getElementById("id1").innerHTML = "我が輩は犬である";
      }
      function cat() {
        document.getElementById("id1").innerHTML = "我が輩は猫である";
      }

      //課題10-2追加
      function red() {
        let sentence = document.getElementById("id1");
        sentence.style.color = "red";
      }
      function blue() {
        let sentence = document.getElementById("id1");
        sentence.style.color = "blue";
      }
      function black() {
        let sentence = document.getElementById("id1");
        sentence.style.color = "black";
      }
    </script>
  </body>
</html>
