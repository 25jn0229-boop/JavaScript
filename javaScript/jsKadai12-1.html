<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="id1"></h1>

    <button onclick="start()">スタート</button>
    <button onclick="stop()">ストップ</button>
    <button onclick="red()">赤色に変更</button>
    <button onclick="blue()">青色に変更</button>
    <button onclick="black()">黒色に変更</button>

    <script>
      let starttime = null;
      let timerID = null;
      function start() {
        if (timerID === null) {
          starttime = new Date();
          timerID = setInterval(dispTime, 10);
        }
      }

      function stop() {
        clearInterval(timerID);
        timerID = null;
      }

      function dispTime() {
        let nowtime = new Date();

        seconds = (nowtime - starttime) / 1000;

        document.getElementById("id1").innerHTML =
          `ページを開いてから：${seconds.toFixed(2)}秒経過`;
      }

      function red() {
        let sentence = document.getElementById("id1");
        sentence.style.color = "red";
      }
      function blue() {
        let sentence = document.getElementById("id1");
        sentence.style.color = "blue";
      }
      function black() {
        let sentence = document.getElementById("id1");
        sentence.style.color = "black";
      }
    </script>
  </body>
</html>
